# Full stack: Caddy (TLS + single origin) -> Next.js client + FastAPI server,
# with the optional Docker/Playwright computer runtime behind a socket proxy.
#
#   cp .env.example .env     # set SITE_ADDRESS
#   docker compose up --build -d
#
# To enable the computer runtime add to .env:
#   COMPUTER_PROVIDER=docker
#   COMPOSE_PROFILES=computer

name: cubicle

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-https://localhost}
    # Derive the bare hostname/IP for Caddy's default_sni (see deploy/Caddyfile).
    command: >
      sh -c 'export SITE_HOST="$$(printf %s "$$SITE_ADDRESS" | sed -E "s#^[a-z]+://##; s#[:/].*##")";
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # A host path here (e.g. /mnt/user/appdata/cubicle/caddy) keeps
      # Caddy's internal CA and certificates with the rest of your appdata.
      - ${CADDY_DATA_DIR:-caddy_data}:/data
      - caddy_config:/config
    networks:
      - default
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      # Required. Pasted into the login screen by anyone using the app.
      # 1 when SITE_ADDRESS is https://, 0 for a plain http:// address.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-1}
      CORS_ORIGINS: ${SITE_ADDRESS:-https://localhost}
      # LLM defaults. All optional; App Settings in the UI overrides them.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      # Tool and context knobs; unset means the server defaults (see README).
      LLM_TOOLS_ENABLED: ${LLM_TOOLS_ENABLED:-1}
      LLM_MAX_TOOL_ROUNDS: ${LLM_MAX_TOOL_ROUNDS:-100}
      LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-0}
      LLM_STALLED_ROUNDS: ${LLM_STALLED_ROUNDS:-3}
      CONTEXT_STOP_AT: ${CONTEXT_STOP_AT:-0.9}
      BOT_MEMORY_MAX_CHARS: ${BOT_MEMORY_MAX_CHARS:-16000}
      BOT_TODO_MAX_ITEMS: ${BOT_TODO_MAX_ITEMS:-50}
      TZ: ${TZ:-UTC}
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-}
      SCHEDULE_TICK_SECONDS: ${SCHEDULE_TICK_SECONDS:-30}
      LLM_SCREENSHOTS_TO_MODEL: ${LLM_SCREENSHOTS_TO_MODEL:-auto}
      APPROVAL_TIMEOUT_SECONDS: ${APPROVAL_TIMEOUT_SECONDS:-900}
      CONTEXT_COMPACT_AT: ${CONTEXT_COMPACT_AT:-0.7}
      CONTEXT_KEEP_RECENT_TOKENS: ${CONTEXT_KEEP_RECENT_TOKENS:-30000}
      CONTEXT_TOOL_RESULT_CHARS: ${CONTEXT_TOOL_RESULT_CHARS:-4000}
      CONTEXT_TOOL_RESULTS_MESSAGE_CHARS: ${CONTEXT_TOOL_RESULTS_MESSAGE_CHARS:-24000}
      COMPOSIO_IMPORTANT_TOOLS_ONLY: ${COMPOSIO_IMPORTANT_TOOLS_ONLY:-1}
      COMPOSIO_TOOLS_PER_TOOLKIT: ${COMPOSIO_TOOLS_PER_TOOLKIT:-40}
      FILE_SHARE_MAX_BYTES: ${FILE_SHARE_MAX_BYTES:-209715200}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      # Auto-approval defaults. All optional; App Settings in the UI overrides
      # them. A decision server on the Docker host itself is reached as
      # http://host.docker.internal:<port>, like LLM_BASE_URL.
      AUTO_APPROVAL: ${AUTO_APPROVAL:-off}
      DECIDER_URL: ${DECIDER_URL:-}
      DECIDER_THRESHOLD: ${DECIDER_THRESHOLD:-0.2}
      DECIDER_TIMEOUT_SECONDS: ${DECIDER_TIMEOUT_SECONDS:-15}
      # Computer provider: fake (default) or docker (needs the `computer` profile).
      COMPUTER_PROVIDER: ${COMPUTER_PROVIDER:-fake}
      COMPUTER_DOCKER_IMAGE: ${COMPUTER_DOCKER_IMAGE:-cubicle-computer:2.8.0}
      COMPUTER_DOCKER_COMMAND_TIMEOUT: ${COMPUTER_DOCKER_COMMAND_TIMEOUT:-60}
      COMPUTER_DOCKER_COMMAND_TIMEOUT_MAX: ${COMPUTER_DOCKER_COMMAND_TIMEOUT_MAX:-600}
      COMPUTER_DOCKER_NAVIGATE_TIMEOUT: ${COMPUTER_DOCKER_NAVIGATE_TIMEOUT:-30}
      COMPUTER_DOCKER_NETWORK: cubicle-computers
      COMPUTER_DOCKER_WORKSPACE_MODE: ${COMPUTER_DOCKER_WORKSPACE_MODE:-volume}
      COMPUTER_DOCKER_HOST_WORKSPACE_ROOT: ${COMPUTER_DOCKER_HOST_WORKSPACE_ROOT:-}
      # The shared folder is mounted into every computer at /shared when its
      # host path is known: WORKSPACE_DIR if it is absolute, or this override.
      WORKSPACE_DIR: ${WORKSPACE_DIR:-}
      COMPUTER_DOCKER_HOST_SHARED_DIR: ${COMPUTER_DOCKER_HOST_SHARED_DIR:-}
      COMPUTER_DOCKER_WALLPAPER: ${COMPUTER_WALLPAPER:-}
      COMPUTER_DOCKER_TMP_SIZE: ${COMPUTER_DOCKER_TMP_SIZE:-2g}
      COMPUTER_DOCKER_INSTALL_TIMEOUT: ${COMPUTER_DOCKER_INSTALL_TIMEOUT:-600}
      # The Docker CLI inside the API only ever reaches the socket proxy.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      # Everything the app persists (SQLite database, sandbox workspaces in
      # volume mode). A host path here puts it in a directory your backups
      # already cover instead of a named volume inside Docker's storage.
      - ${API_DATA_DIR:-api_data}:/data
      - ${WORKSPACE_DIR:-./workspace}:/workspace
    extra_hosts:
      # Lets LLM_BASE_URL point at a model server on the Docker host, e.g.
      # http://host.docker.internal:8080/v1 (Linux needs this; Docker Desktop
      # provides it already).
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    networks:
      - default
      - computers
      - docker-control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - default

  # Narrow gateway to the host Docker daemon for the computer runtime. Only
  # the API can reach it (internal network), and only the listed operations
  # are allowed through.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    profiles:
      - computer
    restart: unless-stopped
    environment:
      LOG_LEVEL: warning
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      # computer_install_packages runs apt in the sandbox through docker exec;
      # a reset in volume mode removes the computer's home volume.
      EXEC: 1
      VOLUMES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-control

  # Builds the pinned runtime image on `docker compose build`; it never runs
  # as a service. The API starts one container per bot from this image.
  computer-runtime:
    build: ./runtime
    image: ${COMPUTER_DOCKER_IMAGE:-cubicle-computer:2.8.0}
    profiles:
      - computer
    deploy:
      replicas: 0
    networks:
      - computers

networks:
  default:
  # Runtime containers live here. They can reach the internet and the API,
  # but not Caddy, the web container, or the socket proxy.
  computers:
    name: cubicle-computers
  # Internal only: no egress, only the API and the socket proxy are attached.
  docker-control:
    internal: true

volumes:
  api_data:
  caddy_data:
  caddy_config:
